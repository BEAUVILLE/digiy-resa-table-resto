function render(){var l=getLang(),x=T[l]||T.fr;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';document.getElementById('kicker').textContent=x.kicker;document.getElementById('title').textContent=x.title;document.getElementById('lead').textContent=x.lead;document.getElementById('doctrine').textContent=x.doctrine;document.getElementById('realTitle').textContent=x.realTitle;document.getElementById('realLead').textContent=x.realLead;document.getElementById('placesTitle').textContent=x.placesTitle;document.getElementById('placesLead').textContent=x.placesLead;document.getElementById('priceNote').textContent=x.priceNote;document.getElementById('footer').textContent=x.footer;document.getElementById('process').innerHTML=x.steps.map(function(s){return '<div class="step"><b>'+esc(s[0])+'</b>'+esc(s[1])+'</div>'}).join('');document.getElementById('realCards').innerHTML=REAL.map(function(r){return '<article class="card real"><span class="badge">'+esc(x.realBadge)+'</span><h3>'+r.icon+' '+esc(r.name)+'</h3><div class="meta">📍 '+esc(r.zone)+' · '+esc(x.types[r.type]||r.type)+'</div><div class="chips">'+r.chips.map(function(c){return '<span class="chip">'+esc(c)+'</span>'}).join('')+'</div><div class="rule">'+esc(x.rule)+'</div><div class="actions"><a class="btn primary" href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(x.open)+'</a><a class="btn secondary" href="'+esc(r.wa)+'" target="_blank" rel="noopener">'+esc(x.wa)+'</a></div></article>'}).join('');document.getElementById('demoCards').innerHTML='<div class="openPlacesTitle">'+esc(x.placesTitle)+'</div>'+DEMO.map(function(d){var url=d.url+l;return '<article class="card demo"><span class="badge">'+esc(x.demoBadge)+'</span><h3>'+d.icon+' '+esc(d.title)+'</h3><div class="meta">📍 '+esc(d.zone)+' · PETITE CÔTE<br>🪪 '+esc(x.demoSummary)+'</div><div class="chips">'+d.chips.map(function(c){return '<span class="chip">'+esc(c)+'</span>'}).join('')+'<span class="chip">'+esc(d.price)+'</span><span class="chip">'+esc(x.commission)+'</span></div><div class="actions"><a class="btn primary" href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(x.demoOpen)+'</a></div></article>'}).join('');document.querySelectorAll('[data-lang]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-lang')===l)})}
document.getElementById('langs').addEventListener('click',function(e){var b=e.target.closest('[data-lang]');if(!b)return;var l=b.getAttribute('data-lang');try{localStorage.setItem('digiy_resa_lang',l)}catch(err){}var u=new URL(location.href);u.searchParams.set('lang',l);history.replaceState(null,'',u.pathname+u.search);render()});render();
})();
</script>
