<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Réserver à Saly | DIGIY</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0a0f0d;
  color:#fff;
}

.wrap{
  max-width:1000px;
  margin:auto;
  padding:16px;
}

h1{
  font-size:26px;
  margin-bottom:8px;
}

p{
  color:#aaa;
}

.grid{
  display:grid;
  gap:14px;
  margin-top:16px;
}

.card{
  background:#111;
  padding:14px;
  border-radius:14px;
}

.btn{
  display:inline-block;
  padding:10px 14px;
  background:#22c55e;
  color:#000;
  border-radius:8px;
  text-decoration:none;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="wrap">

<!-- HERO -->
<h1>Réserver à Saly sans se perdre</h1>
<p>Ici, tu vois ce qui est disponible maintenant et ce qui vaut le détour.</p>

<!-- DISPONIBLE -->
<h2>Disponible maintenant</h2>

<div id="live" class="grid"></div>

<!-- A DECOUVRIR -->
<h2>À découvrir</h2>

<div id="fallback" class="grid"></div>

</div>

<script>
const LIVE = document.getElementById("live");
const FALLBACK = document.getElementById("fallback");

/* =========================
   DONNÉES FALLBACK
========================= */
const fallbackData = [
  {
    name:"Restaurant Chez Ali",
    desc:"Cuisine locale à Saly",
    phone:"221771342889"
  },
  {
    name:"Massage Saly Relax",
    desc:"Massage détente bord de mer",
    phone:"221771342889"
  }
];

/* =========================
   AFFICHAGE FALLBACK
========================= */
function renderFallback(){
  FALLBACK.innerHTML = "";
  fallbackData.forEach(x=>{
    FALLBACK.innerHTML += `
      <div class="card">
        <strong>${x.name}</strong>
        <p>${x.desc}</p>
        <a class="btn" href="https://wa.me/${x.phone}">
          📲 Contacter
        </a>
      </div>
    `;
  });
}

/* =========================
   FAKE LIVE (à remplacer)
========================= */
async function loadLive(){
  try{
    // simulation
    const data = [];

    if(!data.length){
      renderFallback();
      return;
    }

    LIVE.innerHTML = data.map(x=>`
      <div class="card">
        <strong>${x.name}</strong>
        <p>${x.desc}</p>
        <a class="btn" href="${x.link}">
          Réserver
        </a>
      </div>
    `).join("");

  }catch(e){
    renderFallback();
  }
}

loadLive();
</script>

</body>
</html>
