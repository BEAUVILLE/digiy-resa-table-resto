<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>DIGIY RESA TABLE — Fiche établissement</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#061b14" />
  <meta name="description" content="Fiche publique établissement DIGIY RESA TABLE." />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#061b14;
      --ink:#F4FFF8;
      --muted:#CFE9D7;
      --line:rgba(148,163,184,.20);
      --gold:#facc15;
      --green:#22c55e;
      --orange:#f97316;
      --shadow:0 18px 55px rgba(0,0,0,.42);
    }
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    body{
      min-height:100vh;
      background:
        radial-gradient(circle at top, rgba(250,204,21,.10) 0, transparent 55%),
        radial-gradient(circle at 18% 10%, rgba(34,197,94,.10) 0, transparent 55%),
        radial-gradient(circle at top,#0b2218 0,#061b14 50%,#04110d 100%);
      color:var(--ink);
    }
    .page{max-width:980px;margin:0 auto;padding:16px 14px 42px}
    .nav{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:10px 0 14px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:14px;flex-wrap:wrap;
    }
    .logo{
      display:flex;align-items:center;gap:12px;
    }
    .logo-badge{
      width:42px;height:42px;border-radius:16px;
      background:radial-gradient(circle at 30% 20%,var(--gold),var(--orange));
      display:flex;align-items:center;justify-content:center;
      color:#04110d;font-weight:1000;font-size:18px;
      box-shadow:0 10px 26px rgba(250,204,21,.40);
    }
    .logo-title{font-size:16px;font-weight:950;letter-spacing:.10em;text-transform:uppercase}
    .logo-sub{font-size:12px;color:var(--muted);font-weight:850;margin-top:2px}
    .btn{
      border-radius:999px;
      padding:11px 14px;
      font-size:13px;
      font-weight:950;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      white-space:nowrap;
      border:1px solid rgba(203,213,225,0.28);
      background:rgba(15,23,42,0.28);
      color:var(--ink);
    }
    .btn.primary{
      border:none;
      background:linear-gradient(135deg,var(--gold),var(--orange));
      color:#04110d;
      box-shadow:0 10px 24px rgba(250,204,21,.30);
    }
    .hero{
      border-radius:24px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(7,24,17,.55);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .photo{
      width:100%;
      height:320px;
      background:rgba(0,0,0,.24);
      border-bottom:1px solid rgba(255,255,255,.08);
      position:relative;
    }
    .photo img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .badgeTop{
      position:absolute;top:12px;left:12px;display:flex;gap:8px;flex-wrap:wrap;
    }
    .chip{
      border-radius:999px;
      padding:6px 10px;
      font-size:11px;
      font-weight:1000;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(2,6,23,.55);
      color:rgba(234,255,241,.92);
      display:inline-flex;align-items:center;gap:6px;
      backdrop-filter:blur(6px);
    }
    .chip.gold{border-color:rgba(250,204,21,.30)}
    .chip.green{border-color:rgba(34,197,94,.30)}
    .body{padding:18px;display:grid;gap:14px}
    h1{font-size:32px;line-height:1.08;font-weight:1000;color:var(--gold)}
    .meta{display:flex;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:14px;font-weight:850}
    .bio{font-size:15px;line-height:1.6;color:rgba(234,255,241,.94);font-weight:850}
    .tags{display:flex;flex-wrap:wrap;gap:8px}
    .tag{
      border-radius:999px;
      padding:6px 10px;
      border:1px solid rgba(203,213,225,0.22);
      color:var(--muted);
      background:rgba(2,6,23,.35);
      font-size:11px;
      font-weight:950;
    }
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    .card{
      margin-top:14px;
      border-radius:20px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(7,24,17,.55);
      box-shadow:var(--shadow);
      padding:16px;
    }
    .card h2{font-size:18px;margin-bottom:8px}
    .muted{color:var(--muted);line-height:1.55;font-weight:850}
    .status{
      margin-top:14px;
      border-radius:16px;
      border:1px solid rgba(203,213,225,.14);
      background:rgba(2,6,23,.45);
      padding:12px 12px;
      font-size:13px;
      font-weight:900;
      color:var(--muted);
    }
    .footer{
      margin-top:22px;
      border-top:1px solid rgba(255,255,255,.08);
      padding-top:14px;
      font-size:12px;
      color:var(--muted);
      text-align:center;
      font-weight:850;
      line-height:1.5;
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="nav">
      <div class="logo">
        <div class="logo-badge">🍽️</div>
        <div>
          <div class="logo-title">DIGIY RESA TABLE</div>
          <div class="logo-sub">Fiche publique établissement</div>
        </div>
      </div>

      <a class="btn" href="./index.html">← Retour vitrine</a>
    </header>

    <section class="hero" id="hero"></section>

    <section class="card">
      <h2>Réservation simple</h2>
      <div class="muted" id="bookingText">
        Réserve directement depuis la fiche publique.
      </div>
      <div class="actions" style="margin-top:12px" id="bottomActions"></div>
    </section>

    <div class="status" id="statusText">Chargement de la fiche…</div>

    <footer class="footer">
      DIGIY RESA TABLE • Fiche publique • Saly ∞
    </footer>
  </div>

  <script>
    const FALLBACK_PHOTO = "https://orange-pig-270004.hostingersite.com/wp-content/uploads/2026/03/chatgpt-image-4-mars-2026-23_40_53.png";
    const SUPPORT_WA = "221771342889";

    const SUPABASE_URL = "https://wesqmwjjtsefyjnluosj.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indlc3Ftd2pqdHNlZnlqbmx1b3NqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUxNzg4ODIsImV4cCI6MjA4MDc1NDg4Mn0.dZfYOc2iL2_wRYL3zExZFsFSBK6AbMeOid2LrIjcTdA";

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: false,
        autoRefreshToken: false,
        detectSessionInUrl: false,
        storage: {
          getItem: () => null,
          setItem: () => {},
          removeItem: () => {}
        }
      }
    });

    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function qs(name){
      return new URL(location.href).searchParams.get(name) || "";
    }

    function normalizePhone(v){
      return String(v || "").replace(/[^\d]/g, "");
    }

    function renderPlaceholder(slot = ""){
      const hero = document.getElementById("hero");
      const bottom = document.getElementById("bottomActions");
      const status = document.getElementById("statusText");

      hero.innerHTML = `
        <div class="photo">
          <img src="${FALLBACK_PHOTO}" alt="Fiche placeholder"/>
          <div class="badgeTop">
            <span class="chip gold">🪑 SLOT DISPONIBLE</span>
            <span class="chip green">🍽️ RESA TABLE</span>
          </div>
        </div>

        <div class="body">
          <h1>Votre établissement ici</h1>
          <div class="meta">
            <span>🏷️ Place vitrine</span>
            <span>📍 Saly${slot ? " • emplacement " + esc(slot) : ""}</span>
          </div>

          <div class="bio">
            Ceci est une fiche type publique. Quand un établissement actif entre dans la vitrine,
            sa vraie carte et sa vraie fiche prennent la place naturellement.
          </div>

          <div class="tags">
            <span class="tag">Vitrine locale</span>
            <span class="tag">Réservation simple</span>
            <span class="tag">Carte publique</span>
          </div>

          <div class="actions">
            <a class="btn primary" target="_blank" rel="noopener"
               href="https://wa.me/${SUPPORT_WA}?text=${encodeURIComponent("Salut DIGIY RESA TABLE, je veux poser ma carte dans la vitrine de Saly.")}">
              🪑 Poser ma carte
            </a>
            <a class="btn" href="./index.html">← Retour vitrine</a>
          </div>
        </div>
      `;

      bottom.innerHTML = `
        <a class="btn primary" target="_blank" rel="noopener"
           href="https://wa.me/${SUPPORT_WA}?text=${encodeURIComponent("Salut DIGIY RESA TABLE, je veux rejoindre la vitrine publique.")}">
          💬 Rejoindre
        </a>
      `;

      status.textContent = "Fiche placeholder affichée.";
    }

    function renderCard(r){
      const hero = document.getElementById("hero");
      const bottom = document.getElementById("bottomActions");
      const status = document.getElementById("statusText");

      const name = esc(r.business_name || "Établissement");
      const city = esc(r.city || "Saly");
      const address = esc(r.address || "");
      const description = esc(r.description || r.tagline || "Fiche publique établissement.");
      const openHours = esc(r.open_hours || "");
      const photo = esc((r.photo_url || FALLBACK_PHOTO) + (((r.photo_url || FALLBACK_PHOTO).includes("?")) ? "&" : "?") + "v=5");
      const phone = normalizePhone(r.whatsapp_phone || r.call_phone || "");
      const reserveHref = `./reserver.html?slug=${encodeURIComponent(r.slug || "")}`;

      hero.innerHTML = `
        <div class="photo">
          <img src="${photo}" alt="${name}" onerror="this.onerror=null;this.src='${FALLBACK_PHOTO}'" />
          <div class="badgeTop">
            <span class="chip gold">🍽️ ÉTABLISSEMENT</span>
            <span class="chip green">🟢 ABO ACTIF</span>
          </div>
        </div>

        <div class="body">
          <h1>${name}</h1>

          <div class="meta">
            <span>📍 ${city}${address ? " • " + address : ""}</span>
            ${openHours ? `<span>🕒 ${openHours}</span>` : ``}
          </div>

          <div class="bio">${description}</div>

          <div class="tags">
            <span class="tag">RESA TABLE</span>
            <span class="tag">${city}</span>
            ${openHours ? `<span class="tag">Horaires: ${openHours}</span>` : ``}
          </div>

          <div class="actions">
            <a class="btn primary" href="${reserveHref}">📅 Réserver</a>
            ${phone ? `
              <a class="btn" target="_blank" rel="noopener"
                 href="https://wa.me/${phone}?text=${encodeURIComponent("Bonjour, je vous contacte depuis votre fiche DIGIY RESA TABLE.")}">
                💬 WhatsApp
              </a>
            ` : ``}
            <a class="btn" href="./index.html">← Retour vitrine</a>
          </div>
        </div>
      `;

      bottom.innerHTML = `
        <a class="btn primary" href="${reserveHref}">📅 Réserver maintenant</a>
        ${phone ? `
          <a class="btn" target="_blank" rel="noopener"
             href="https://wa.me/${phone}?text=${encodeURIComponent("Bonjour, je vous contacte depuis votre fiche DIGIY RESA TABLE.")}">
            💬 Contacter
          </a>
        ` : ``}
      `;

      status.textContent = "Fiche publique chargée.";
    }

    async function load(){
      const slug = (qs("slug") || "").trim().toLowerCase();
      const demo = qs("demo");
      const slot = qs("slot");

      if(demo === "1" || !slug){
        renderPlaceholder(slot);
        return;
      }

      try{
        const { data, error } = await sb.rpc("resa_get_public_card_by_slug", {
          p_slug: slug
        });

        if(error) throw error;

        if(!data || !data.slug){
          renderPlaceholder(slot);
          return;
        }

        renderCard(data);
      }catch(e){
        console.error(e);
        renderPlaceholder(slot);
        document.getElementById("statusText").textContent = "Erreur de chargement, fiche placeholder affichée.";
      }
    }

    load();
  </script>
</body>
</html>
