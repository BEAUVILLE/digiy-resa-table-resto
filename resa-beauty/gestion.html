<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestion BEAUTY</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font:15px system-ui;background:#f8edf4;padding:18px;color:#342333}.wrap{max-width:760px;margin:auto}.card{background:#fff;border:1px solid #e5cfdb;border-radius:20px;padding:18px;margin-top:14px}input,select,textarea,button{width:100%;min-height:44px;margin-top:8px;border-radius:12px;border:1px solid #dbc7d2;padding:10px;font:inherit}textarea{min-height:90px}button{background:#7b2e5c;color:#fff;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a href="./index.html?slug=test-resa-beauty-saly">← Vue publique</a><section class="card"><h1 id="title">💇 BEAUTY MASTER</h1><div id="who"></div><div class="grid"><input id="city" placeholder="Ville"><input id="zone" placeholder="Zone"><select id="status"><option value="available">Disponible</option><option value="busy">Occupé</option><option value="unavailable">Indisponible</option></select><input id="wa" placeholder="+221..."></div><textarea id="note" placeholder="Note d'ouverture"></textarea><textarea id="services" placeholder='Prestations JSON'></textarea><button id="save">ENREGISTRER</button><div id="msg"></div></section></div><script>(()=>{'use strict';const db=supabase.createClient('https://wesqmwjjtsefyjnluosj.supabase.co','sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3',{auth:{persistSession:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id),slug=new URLSearchParams(location.search).get('slug')||'test-resa-beauty-saly';let id=null;async function boot(){const {data:{session}}=await db.auth.getSession();if(!session)return location.replace('./acces-proprietaire.html?slug='+encodeURIComponent(slug));$('who').textContent='Connecté : '+session.user.email;const {data,error}=await db.rpc('digiy_beauty_owner_get_v1',{p_slug:slug});if(error)return $('msg').textContent='⚠️ '+error.message;const r=Array.isArray(data)?data[0]:data;if(!r)return $('msg').textContent='Aucun accès propriétaire';id=r.id;$('title').textContent='💇 '+r.display_name;$('city').value=r.city||'';$('zone').value=r.zone||'';$('status').value=r.availability_status;$('wa').value=r.whatsapp_phone||'';$('note').value=r.opening_note||'';$('services').value=JSON.stringify(r.services||[],null,2)}$('save').onclick=async()=>{let services;try{services=JSON.parse($('services').value||'[]')}catch(e){return $('msg').textContent='⚠️ JSON prestations invalide'}const {error}=await db.rpc('digiy_beauty_owner_update_v1',{p_id:id,p_city:$('city').value,p_zone:$('zone').value,p_services:services,p_status:$('status').value,p_opening_note:$('note').value,p_whatsapp_phone:$('wa').value});$('msg').textContent=error?'⚠️ '+error.message:'✅ Profil BEAUTY mis à jour'};boot();})();</script></body></html>
