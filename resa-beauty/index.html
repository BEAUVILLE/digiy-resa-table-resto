<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEST RÉSA BEAUTY · SALY</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff7fb;color:#342333;font:15px system-ui;padding:18px}.wrap{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 14px;border-radius:999px;text-decoration:none;font-weight:900;border:1px solid #e4c8d9;background:#fff;color:#7b2e5c}.primary{background:#7b2e5c;color:#fff;border-color:#7b2e5c}.card{background:#fff;border:1px solid #ecdbe5;border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 12px 30px #7b2e5c12}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 10px;border-radius:999px;background:#f8e7f1;font-weight:850}.service,.slot{border:1px solid #ecdbe5;border-radius:14px;padding:12px;margin-top:8px}.slot{display:inline-flex;margin-right:8px}.muted{color:#7f6675;font-weight:700}.hidden{display:none}</style></head><body><div class="wrap"><div class="top"><strong>💇 DIGIY RÉSA BEAUTY</strong><a class="btn" id="owner" href="./acces-proprietaire.html?slug=test-resa-beauty-saly">🔐 Accès propriétaire</a></div><section class="card"><div class="muted">EXEMPLE TEST · SALY</div><h1 id="name">Chargement…</h1><div class="chips"><span class="chip" id="status">—</span><span class="chip" id="place">—</span></div><p id="note" class="muted"></p></section><section class="card"><h2>Prestations</h2><div id="services"></div></section><section class="card"><h2>Créneaux</h2><input id="day" type="date"><div id="slots"></div></section><section class="card"><h2>Contact direct</h2><a class="btn primary hidden" id="wa" target="_blank" rel="noopener">💬 WhatsApp direct</a><div id="waMissing" class="muted">WhatsApp non publié pour ce test.</div></section></div><script>(()=>{'use strict';const db=supabase.createClient('https://wesqmwjjtsefyjnluosj.supabase.co','sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3');const p=new URLSearchParams(location.search),slug=(p.get('slug')||'test-resa-beauty-saly').trim(),$=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(v){return new Intl.NumberFormat('fr-FR').format(Number(v||0))+' FCFA'}async function loadProfile(){const {data,error}=await db.rpc('digiy_beauty_public_profile_v1',{p_slug:slug});if(error)throw error;const r=Array.isArray(data)?data[0]:data;if(!r)throw new Error('not_found');$('name').textContent=r.display_name;$('status').textContent=r.availability_status==='available'?'Disponible':(r.availability_status==='busy'?'Occupé':'Indisponible');$('place').textContent=[r.city,r.zone].filter(Boolean).join(' · ');$('note').textContent=r.opening_note||'';$('services').innerHTML=(Array.isArray(r.services)?r.services:[]).map(s=>'<div class="service"><strong>'+esc(s.name)+'</strong><div class="muted">'+esc(s.duration_min)+' min · '+money(s.price)+'</div></div>').join('')||'<div class="muted">Aucune prestation.</div>';if(r.whatsapp_phone){const n=String(r.whatsapp_phone).replace(/\D/g,'');$('wa').href='https://wa.me/'+n;$('wa').classList.remove('hidden');$('waMissing').classList.add('hidden')}}async function loadSlots(){const d=$('day').value;if(!d)return;const {data,error}=await db.rpc('digiy_beauty_public_slots_v1',{p_slug:slug,p_day:d});if(error)throw error;$('slots').innerHTML=(data||[]).map(s=>'<span class="slot">'+esc(String(s.slot_time).slice(0,5))+' · '+(s.status==='available'?'Disponible':esc(s.status))+'</span>').join('')||'<div class="muted">Aucun créneau.</div>'}$('day').value=new Date().toISOString().slice(0,10);$('day').onchange=loadSlots;Promise.all([loadProfile(),loadSlots()]).catch(()=>{$('name').textContent='Fiche test indisponible'});})();</script></body></html>
