name: RÉSA universel — contrôle avant SQL
on:
  pull_request:
    paths:
      - 'docs/RESA_UNIVERSEL_PRE_SQL_GO_NO_GO_20261009.md'
      - 'contracts/resa-universal-pre-sql-gates.json'
      - 'tests/resa-universal-pre-sql-contract.test.cjs'
      - '.github/workflows/resa-universal-pre-sql.yml'
  push:
    branches: [main]
    paths:
      - 'docs/RESA_UNIVERSEL_PRE_SQL_GO_NO_GO_20261009.md'
      - 'contracts/resa-universal-pre-sql-gates.json'
      - 'tests/resa-universal-pre-sql-contract.test.cjs'
      - '.github/workflows/resa-universal-pre-sql.yml'
permissions:
  contents: read
jobs:
  audit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contrôler les portes GO/NO GO sans SQL ni données réelles
        run: node --test tests/resa-universal-pre-sql-contract.test.cjs
