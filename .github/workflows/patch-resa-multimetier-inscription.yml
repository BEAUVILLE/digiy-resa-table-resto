name: Patch RESA multi-metier inscription copy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-resa-multimetier-inscription.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Open RESA inscription to multi-metier language
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("inscription-resa.html")
          html = path.read_text(encoding="utf-8")
          before = html

          replacements = {
            "<title>Carte tarif établissement — DIGIY RESA</title>": "<title>Carte tarif activité — DIGIY RESA</title>",
            "Carte tarif DIGIY RESA : abonnement réservation, Boost EXPLORE, RÉSEAU DIGIY, total à payer et paiement Wave concret.": "Carte tarif DIGIY RESA : abonnement réservation multi-métiers, rendez-vous, créneaux, Boost EXPLORE, RÉSEAU DIGIY, total à payer et paiement Wave concret.",
            "<span class=\"logo\">🍽️</span><span><strong>DIGIY RESA</strong><small>Carte tarif établissement · module pro</small></span>": "<span class=\"logo\">📅</span><span><strong>DIGIY RESA</strong><small>Carte tarif activité · réservations & rendez-vous</small></span>",
            "<div class=\"kicker\">🍽️ Je prends des réservations</div>": "<div class=\"kicker\">📅 Je prends des réservations / rendez-vous</div>",
            "L’établissement ne cherche pas son prix dans la foule. Ici : RESA seulement, Boost EXPLORE si besoin, RÉSEAU DIGIY si visibilité, puis paiement Wave clair.": "Le professionnel ne cherche pas son prix dans la foule. Ici : RESA pour réserver une table, un rendez-vous, un créneau, une consultation ou un service ; Boost EXPLORE si besoin, RÉSEAU DIGIY si visibilité, puis paiement Wave clair.",
            "Le restaurant garde sa table, son client et sa relation directe.": "Le professionnel garde son agenda, ses clients et sa relation directe.",
            "Choisis ton abonnement RESA. Les extras s’additionnent en sous-total, puis le paiement Wave affiche tout le détail.": "Choisis ton abonnement RESA selon ton activité. Les extras s’additionnent en sous-total, puis le paiement Wave affiche tout le détail.",
            "<div class=\"section-title\">🍽️ Abonnement module RESA</div>": "<div class=\"section-title\">📅 Abonnement module RESA</div>",
            "Choisis uniquement ton niveau RESA. Pas de colonie des autres modules.": "Choisis uniquement ton niveau RESA. Pas de confusion : réservation, rendez-vous ou créneaux selon ton métier.",
            "Le restaurant": "Le professionnel",
            "le restaurant": "le professionnel",
            "Restaurant": "Activité",
            "restaurant": "activité",
            "table, son client": "agenda, son client",
            "sa table": "son agenda",
            "🍽️": "📅"
          }

          for old, new in replacements.items():
              html = html.replace(old, new)

          # Ajoute une ligne claire après le sous-texte principal si elle n'existe pas déjà.
          marker = "réservation, rendez-vous ou créneaux selon ton métier.</div>"
          extra = "réservation, rendez-vous ou créneaux selon ton métier.</div><p class=\"note\"><strong>Ouvert multi-métiers :</strong> docteur, avocat, architecte, salon de coiffure, onglerie, garage, consultant, restaurant, activité locale ou service terrain.</p>"
          if marker in html and "Ouvert multi-métiers" not in html:
              html = html.replace(marker, extra, 1)

          if html == before:
              print("Aucun changement détecté : contenu déjà corrigé ou structure différente.")
          else:
              path.write_text(html, encoding="utf-8")
              print("Inscription RESA corrigée en langage multi-métiers.")
          PY

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inscription-resa.html
          git commit -m "Open RESA inscription copy to multi-metier reservations"
          git push
