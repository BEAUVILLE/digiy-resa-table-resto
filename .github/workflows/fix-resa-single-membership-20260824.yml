# trigger 2 2026-08-24
name: Fix RESA single membership
on:
  push:
    paths:
      - '.github/workflows/fix-resa-single-membership-20260824.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply single membership to RESA
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          target='https://digiylyfe.com/tarifs-adherents-1.html?country=fr'
          old='''    <div class="resa-pricing">\n      <strong>RESA traverse plusieurs métiers : la cotisation dépend de la catégorie économique de l’adhérent.</strong>\n      <div class="resa-pricing-actions">\n        <a href="https://digiylyfe.com/tarifs-adherents-1.html" target="_blank" rel="noopener">MÉTIER / INDÉPENDANT · À PARTIR DE 19 900 FCFA / mois</a>\n        <a href="https://digiylyfe.com/tarifs-adherents.html" target="_blank" rel="noopener">ÉTABLISSEMENT / STRUCTURE · À PARTIR DE 28 000 FCFA / mois</a>\n      </div>\n    </div>'''
          new=f'''    <div class="resa-pricing">\n      <strong>UNE ADHÉSION DIGIYLYFE · MÊME PRÉSENCE</strong>\n      <div class="resa-pricing-actions">\n        <a href="{target}" target="_blank" rel="noopener">ADHÉSION · 19 900 FCFA / mois · 45 € EUROPE</a>\n      </div>\n    </div>'''
          if old not in s:
              raise SystemExit('RESA pricing block not found; aborting without changes')
          s=s.replace(old,new,1)
          s=s.replace('.resa-pricing-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}', '.resa-pricing-actions{display:grid;grid-template-columns:1fr;gap:7px}')
          s=s.replace('https://digiylyfe.com/tarifs-adherents.html"', target+'"')
          s=s.replace('https://digiylyfe.com/tarifs-adherents-1.html"', target+'"')
          s=s.replace('DEMANDE D’ADHÉSION · À PARTIR DE 19 900 FCFA / mois', 'DEMANDE D’ADHÉSION · 19 900 FCFA / mois · 45 € EUROPE')
          replacements={
            'MEMBERSHIP REQUEST · FROM 19,900 FCFA / month':'MEMBERSHIP REQUEST · 19,900 FCFA / month · €45 EUROPE',
            'SOLICITUD DE ADHESIÓN · DESDE 19 900 FCFA / mes':'SOLICITUD DE ADHESIÓN · 19 900 FCFA / mes · 45 € EUROPA',
            'PEDIDO DE ADESÃO · A PARTIR DE 19 900 FCFA / mês':'PEDIDO DE ADESÃO · 19 900 FCFA / mês · 45 € EUROPA',
            'MITGLIEDSCHAFT ANFRAGEN · AB 19.900 FCFA / Monat':'MITGLIEDSCHAFT · 19.900 FCFA / Monat · 45 € EUROPA',
            'RICHIESTA DI ADESIONE · DA 19 900 FCFA / mese':'ADESIONE · 19 900 FCFA / mese · 45 € EUROPA',
            'LIDMAATSCHAP AANVRAGEN · VANAF 19.900 FCFA / maand':'LIDMAATSCHAP · 19.900 FCFA / maand · 45 € EUROPA',
            'طلب العضوية · ابتداءً من 19,900 فرنك CFA / شهر':'العضوية · 19,900 فرنك CFA / شهر · 45 € أوروبا'
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          if '28 000 FCFA / mois' in s or 'https://digiylyfe.com/tarifs-adherents.html' in s:
              raise SystemExit('Legacy RESA 28000 route/text still present; aborting')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit RESA correction
        run: |
          git config user.name "DIGIYLYFE"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-resa-single-membership-20260824.yml
          git add index.html
          git diff --cached --quiet || git commit -m "RESA: single membership 19 900 FCFA / 45 EUR"
          git push
