name: Patch Proposer un lieu URL

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-proposer-lieu-url.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set correct inscription URL
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          url = "https://resa-table-resto.digiylyfe.com/inscription-resa.html"

          before = html

          # Bouton haut : Proposer un lieu
          html = html.replace('id="btnJoinTop" href="#"', f'id="btnJoinTop" href="{url}"')
          html = html.replace('id="btnJoinTop" href="./inscription-resa.html"', f'id="btnJoinTop" href="{url}"')
          html = html.replace("id='btnJoinTop' href='#'", f"id='btnJoinTop' href='{url}'")
          html = html.replace("id='btnJoinTop' href='./inscription-resa.html'", f"id='btnJoinTop' href='{url}'")

          # Bouton flottant si déjà posé
          html = html.replace('class="floating-resa-signup" href="./inscription-resa.html"', f'class="floating-resa-signup" href="{url}"')
          html = html.replace("class='floating-resa-signup' href='./inscription-resa.html'", f"class='floating-resa-signup' href='{url}'")

          # Secours si le bouton est écrit autrement avec le texte Proposer un lieu
          if "Proposer un lieu" in html and "btnJoinTop" not in html:
              html = html.replace('href="#" rel="noopener">🤝 Proposer un lieu</a>', f'href="{url}" rel="noopener">🤝 Proposer un lieu</a>')
              html = html.replace('href="#">🤝 Proposer un lieu</a>', f'href="{url}">🤝 Proposer un lieu</a>')

          if html == before:
              print("Aucun changement détecté : lien peut déjà être correct ou structure différente.")
          else:
              path.write_text(html, encoding="utf-8")
              print("Lien Proposer un lieu corrigé vers", url)
          PY

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix RESA proposer un lieu inscription URL"
          git push
