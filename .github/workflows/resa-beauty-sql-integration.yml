name: RÉSA / BEAUTY SQL isolation tests
on:
  pull_request:
    paths:
      - 'sql/20261009_p0_lock_private_resa_bookings.sql'
      - 'sql/20261009_beauty_booking_integrity_v2.sql'
      - 'resa-beauty/index.html'
      - 'tests/sql/**'
      - '.github/workflows/resa-beauty-sql-integration.yml'
  push:
    branches: [main]
    paths:
      - 'sql/20261009_p0_lock_private_resa_bookings.sql'
      - 'sql/20261009_beauty_booking_integrity_v2.sql'
      - 'resa-beauty/index.html'
      - 'tests/sql/**'
      - '.github/workflows/resa-beauty-sql-integration.yml'
permissions:
  contents: read
jobs:
  postgres-17:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: digiy_disposable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client >/dev/null
      - name: Run disposable DB tests (no connection to digiy-core)
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: test_only
          PGDATABASE: digiy_disposable_test
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/resa_beauty_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/20261009_p0_lock_private_resa_bookings.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/20261009_beauty_booking_integrity_v2.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/resa_beauty_assertions.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute isolated frontend integration tests
        run: node --test tests/beauty-public-v2.test.cjs
      - name: Public frontend must request slot IDs from V2
        run: |
          grep -q "digiy_beauty_public_slots_v2" resa-beauty/index.html
          if grep -q "digiy_beauty_public_slots_v1" resa-beauty/index.html; then exit 1; fi
