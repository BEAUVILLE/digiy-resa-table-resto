name: RÉSA UNIVERSEL V2 — options publiques isolées, aucun CORE
on:
  pull_request:
    paths:
      - 'sql/candidates/20261009_resa_universal_public_options_v1_ISOLATED*.sql'
      - 'tests/sql/resa_universal_public_options_v1_assertions.sql'
      - '.github/workflows/resa-universal-public-options-isolated.yml'
  push:
    branches: [main]
    paths:
      - 'sql/candidates/20261009_resa_universal_public_options_v1_ISOLATED*.sql'
      - 'tests/sql/resa_universal_public_options_v1_assertions.sql'
      - '.github/workflows/resa-universal-public-options-isolated.yml'
permissions:
  contents: read
jobs:
  postgres17-public-options:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: digiy_appointments_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: digiy_appointments_test
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Installer la fixture A/B et V0, jamais sur CORE
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/resa_beauty_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/resa_planning_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/resa_universal_v0_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/candidates/20261009_resa_universal_v0_ISOLATED.sql
      - name: Charger le catalogue public isolé
        run: psql -X -v ON_ERROR_STOP=1 -f sql/candidates/20261009_resa_universal_public_options_v1_ISOLATED.sql
      - name: Test contrat public, confidentialité, A/B, chevauchement, Dakar seul
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/resa_universal_public_options_v1_assertions.sql
      - name: Retour arrière sans toucher V0 ni l'historique
        run: psql -X -v ON_ERROR_STOP=1 -f sql/candidates/20261009_resa_universal_public_options_v1_ISOLATED_ROLLBACK.sql
