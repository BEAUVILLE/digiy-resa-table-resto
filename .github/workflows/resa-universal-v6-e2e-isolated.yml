name: RÉSA V6 — parcours client-propriétaire intégré sur PG17 jetable
on:
  pull_request:
    paths:
      - 'tests/sql/resa_universal_v6_e2e_acceptance.sql'
      - 'docs/RESA_UNIVERSEL_V6_E2E_RESTORE_GATES_20261010.md'
      - '.github/workflows/resa-universal-v6-e2e-isolated.yml'
  push:
    branches: [main]
    paths:
      - 'tests/sql/resa_universal_v6_e2e_acceptance.sql'
      - 'docs/RESA_UNIVERSEL_V6_E2E_RESTORE_GATES_20261010.md'
      - '.github/workflows/resa-universal-v6-e2e-isolated.yml'
permissions:
  contents: read
jobs:
  e2e-synthetic-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: digiy_appointments_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: digiy_appointments_test
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 17 client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Assemble V0/V1/V2/V5 in a disposable synthetic database
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/resa_beauty_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/resa_planning_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/resa_universal_v0_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/candidates/20261009_resa_universal_v0_ISOLATED.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/resa_universal_pay_owner_v1_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/candidates/20261009_resa_universal_pay_owner_v1_ISOLATED.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/resa_universal_owner_manage_v2_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/candidates/20261010_resa_universal_owner_manage_v2_ISOLATED.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/candidates/20261009_resa_universal_public_options_v1_ISOLATED.sql
      - name: Anonymous client → owner A/B → PAY neutral → freed slot
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/resa_universal_v6_e2e_acceptance.sql
      - name: Roll back V5/V2/V1/V0 on isolated PG17
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f sql/candidates/20261010_resa_universal_owner_manage_v2_ISOLATED_ROLLBACK.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/candidates/20261009_resa_universal_public_options_v1_ISOLATED_ROLLBACK.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/candidates/20261009_resa_universal_pay_owner_v1_ISOLATED_ROLLBACK.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/candidates/20261009_resa_universal_v0_ISOLATED_ROLLBACK.sql
