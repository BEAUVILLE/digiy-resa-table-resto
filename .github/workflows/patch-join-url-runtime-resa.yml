name: Patch RESA runtime join URL

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-join-url-runtime-resa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix JOIN_MODULE_URL and proposer buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          url = "https://resa-table-resto.digiylyfe.com/inscription-resa.html"
          before = html

          html = html.replace('const JOIN_MODULE_URL = "https://vas-chez-digiy.digiylyfe.com/";', f'const JOIN_MODULE_URL = "{url}";')
          html = html.replace("const JOIN_MODULE_URL = 'https://vas-chez-digiy.digiylyfe.com/';", f"const JOIN_MODULE_URL = '{url}';")

          html = html.replace('id="btnJoinTop" href="#"', f'id="btnJoinTop" href="{url}"')
          html = html.replace('id="btnJoinTop" href="./inscription-resa.html"', f'id="btnJoinTop" href="{url}"')
          html = html.replace('id="btnJoinTop" href="https://resa-table-resto.digiylyfe.com/inscription-resa.html"', f'id="btnJoinTop" href="{url}"')
          html = html.replace('id="btnJoinBottom" href="https://vas-chez-digiy.digiylyfe.com/"', f'id="btnJoinBottom" href="{url}"')
          html = html.replace('id="btnJoinBottom" href="#"', f'id="btnJoinBottom" href="{url}"')
          html = html.replace('id="bottomJoin" href="https://vas-chez-digiy.digiylyfe.com/"', f'id="bottomJoin" href="{url}"')
          html = html.replace('id="bottomJoin" href="./inscription-resa.html"', f'id="bottomJoin" href="{url}"')

          if html == before:
              print("Aucun changement : vérifier manuellement la structure.")
          else:
              path.write_text(html, encoding="utf-8")
              print("Correction appliquée : JOIN_MODULE_URL et boutons proposer ->", url)
          PY

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix RESA runtime proposer URL"
          git push
