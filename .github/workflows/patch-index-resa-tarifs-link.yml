name: Patch RESA public tariff links

on:
  push:
    paths:
      - .github/workflows/patch-index-resa-tarifs-link.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route RESA pro/tariff links to inscription-resa
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('href="https://tarifs.digiylyfe.com/" target="_blank" rel="noopener noreferrer"', 'href="./inscription-resa.html"')
          s = s.replace('href="https://tarifs.digiylyfe.com/"', 'href="./inscription-resa.html"')
          s = s.replace('href="https://commencer-a-payer.digiylyfe.com/" target="_blank" rel="noopener noreferrer"', 'href="./inscription-resa.html"')
          s = s.replace('href="https://commencer-a-payer.digiylyfe.com/"', 'href="./inscription-resa.html"')
          s = s.replace('href="https://pro-resa-resto.digiylyfe.com/" target="_blank" rel="noopener noreferrer"', 'href="./inscription-resa.html"')
          s = s.replace('href="https://pro-resa-resto.digiylyfe.com/"', 'href="./inscription-resa.html"')

          s = s.replace('📦 Tarifs DIGIY', '📦 Tarifs RESA')
          s = s.replace('📦 Tarifs</a>', '📦 Tarifs RESA</a>')
          s = s.replace('Voir les tarifs DIGIY', 'Voir les tarifs RESA')
          s = s.replace('Commencer à payer', 'Voir les tarifs RESA')
          s = s.replace('Activer mon module', 'Voir les tarifs RESA')
          s = s.replace('Espace pro', 'Tarifs RESA')
          s = s.replace('Côté pro', 'Tarifs RESA')

          if './inscription-resa.html' not in s:
              raise SystemExit('Lien inscription-resa absent après patch')

          p.write_text(s, encoding='utf-8')
          wf = Path('.github/workflows/patch-index-resa-tarifs-link.yml')
          if wf.exists():
              wf.unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "DIGIY Auto Patch"
          git config user.email "actions@github.com"
          git add index.html .github/workflows/patch-index-resa-tarifs-link.yml
          git commit -m "Route RESA tariff links to inscription page" || echo "Nothing to commit"
          git push
