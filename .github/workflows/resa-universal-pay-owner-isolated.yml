name: RÉSA V1 — propriétaire / PAY en PostgreSQL jetable
on:
  pull_request:
    paths:
      - 'sql/candidates/20261009_resa_universal_pay_owner_v1_ISOLATED*.sql'
      - 'tests/sql/resa_universal_pay_owner_v1_*.sql'
      - '.github/workflows/resa-universal-pay-owner-isolated.yml'
  push:
    branches: [main]
    paths:
      - 'sql/candidates/20261009_resa_universal_pay_owner_v1_ISOLATED*.sql'
      - 'tests/sql/resa_universal_pay_owner_v1_*.sql'
      - '.github/workflows/resa-universal-pay-owner-isolated.yml'
permissions:
  contents: read
jobs:
  postgres17-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: digiy_appointments_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: digiy_appointments_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Setup PostgreSQL legacy fixtures and atomic V0
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/resa_beauty_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/resa_planning_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/resa_universal_v0_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/candidates/20261009_resa_universal_v0_ISOLATED.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/resa_universal_v0_assertions.sql
          node tests/resa-universal-v0-concurrency.cjs
      - name: Prepare mocked real PAY trigger and owner RLS
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/resa_universal_pay_owner_v1_fixture.sql
      - name: Install V1 only on throwaway database
        run: psql -X -v ON_ERROR_STOP=1 -f sql/candidates/20261009_resa_universal_pay_owner_v1_ISOLATED.sql
      - name: Test owner A/B, real authenticated role, payment neutral confirmation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/resa_universal_pay_owner_v1_assertions.sql
      - name: Verify candidate rollback and preserved legacy bookings
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f sql/candidates/20261009_resa_universal_pay_owner_v1_ISOLATED_ROLLBACK.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/candidates/20261009_resa_universal_v0_ISOLATED_ROLLBACK.sql
