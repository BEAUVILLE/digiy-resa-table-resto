name: Patch floating RESA inscription button

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-floating-resa-inscription.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add floating inscription button to index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          css = '''

    /* DIGIY RESA — bouton flottant inscription pro */
    .floating-resa-signup{
      position:fixed;
      right:calc(env(safe-area-inset-right,0px) + 14px);
      bottom:calc(98px + env(safe-area-inset-bottom,0px));
      z-index:99998;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-height:58px;
      padding:16px 20px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.28);
      background:linear-gradient(135deg,var(--gold),var(--orange));
      color:#04110d;
      font-size:16px;
      font-weight:1000;
      line-height:1.05;
      text-decoration:none;
      box-shadow:0 18px 48px rgba(0,0,0,.36),0 10px 30px rgba(250,204,21,.28);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }
    .floating-resa-signup:hover{
      transform:translateY(-2px);
      filter:brightness(1.04);
      box-shadow:0 22px 56px rgba(0,0,0,.42),0 12px 34px rgba(250,204,21,.34);
    }
    .floating-resa-signup .mini{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:30px;
      height:30px;
      border-radius:999px;
      background:rgba(4,17,13,.13);
      font-size:18px;
      flex:0 0 auto;
    }

    @media(max-width:640px){
      .floating-resa-signup{
        left:12px;
        right:12px;
        bottom:calc(88px + env(safe-area-inset-bottom,0px));
        min-height:64px;
        font-size:18px;
        padding:17px 18px;
      }
    }
          '''

          button = '''

  <a class="floating-resa-signup" href="./inscription-resa.html" aria-label="Inscrire mon activité sur DIGIY RESA">
    <span class="mini">🍽️</span>
    <span>Inscrire mon activité RESA</span>
  </a>
          '''

          changed = False

          if ".floating-resa-signup" not in html:
              html = html.replace("\n  </style>", css + "\n  </style>", 1)
              changed = True

          if "class=\"floating-resa-signup\"" not in html:
              marker = '''  <div class="floating-returns" aria-label="Retours DIGIY">
    <a class="floating-back" id="floatingSiteBtn" href="https://digiylyfe.com/" aria-label="Retour au site DIGIYLYFE">🌍 Site</a>
    <a class="floating-back hub" href="https://digiy-hub.digiylyfe.com/" aria-label="Retour au HUB DIGIY">🧭 HUB</a>
  </div>'''
              if marker in html:
                  html = html.replace(marker, marker + button, 1)
              else:
                  html = html.replace("<body>", "<body>" + button, 1)
              changed = True

          # Corrige aussi le bouton du haut s'il pointe encore vers #
          html = html.replace('id="btnJoinTop" href="#"', 'id="btnJoinTop" href="./inscription-resa.html"')

          if changed or 'id="btnJoinTop" href="./inscription-resa.html"' in html:
              path.write_text(html, encoding="utf-8")
              print("Patch RESA flottant appliqué.")
          else:
              print("Aucun changement nécessaire.")
          PY

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add floating RESA inscription button"
          git push
